name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: npm
    - name: Pin npm
      run: npm install --global "npm@$(cat .npm-version)"
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Verify diagnostic size controls
      run: node --test scripts/verify-ci-report.mjs
    - name: Run Playwright tests
      run: npx playwright test --reporter=line,html,json
      env:
        PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/ci-results.json
        PLAYWRIGHT_HTML_OPEN: never
    - name: Package bounded failure diagnostics
      if: ${{ failure() && !cancelled() }}
      run: node scripts/package-ci-report.mjs
    - uses: actions/upload-artifact@v4
      if: ${{ failure() && !cancelled() }}
      with:
        name: playwright-failure-report
        path: test-results/ci-upload/ci-report.tar.gz
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
