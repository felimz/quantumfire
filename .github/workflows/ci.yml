name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Pin npm
        run: npm install --global "npm@$(cat .npm-version)"

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies
        run: npm audit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Verify diagnostic controls
        run: node --test scripts/verify-ci-report.mjs scripts/verify-ci-report-log.mjs

      - name: E2E Playwright Tests
        run: npx playwright test --reporter=line,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/ci-results.json
          PLAYWRIGHT_HTML_OPEN: never

      - name: Build
        run: npm run build

      - name: Retain recoverable diagnostics in job logs
        if: ${{ !cancelled() }}
        run: node scripts/ci-report-log.mjs emit
